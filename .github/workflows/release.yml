name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag '$env:RELEASE_TAG' must use a format such as v1.2.3 or v1.2.3-beta.1."
          }

      - name: Run tests
        run: dotnet test .\JeffDock.Core.Tests\JeffDock.Core.Tests.csproj --configuration Release

      - name: Publish single-file application
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          dotnet publish .\JeffDock.App\JeffDock.App.csproj `
            -p:PublishProfile=win-x64-single-file `
            -p:Version=$version `
            --output .\artifacts\release

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\artifacts\release\AJeff.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AJeff.exe" | Set-Content .\artifacts\release\AJeff.exe.sha256 -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG `
            .\artifacts\release\AJeff.exe `
            .\artifacts\release\AJeff.exe.sha256 `
            --verify-tag `
            --generate-notes `
            --title "AJeff $env:RELEASE_TAG"
