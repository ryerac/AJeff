name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build application
        run: dotnet build .\JeffDock.App\JeffDock.App.csproj --configuration Release

      - name: Build diagnostic CLI
        run: dotnet build .\JeffDock.Cli\JeffDock.Cli.csproj --configuration Release

      - name: Run tests
        run: dotnet test .\JeffDock.Core.Tests\JeffDock.Core.Tests.csproj --configuration Release
